<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f8f9fc" />
    <meta name="referrer" content="no-referrer" />
    <title>Atlas Meet · 회의실</title>
    <link rel="icon" href="/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="top-inner">
        <a class="brand" id="brand" href="/" aria-label="Atlas Meet 회의실"
          ><img src="/mark.svg" alt="" width="35" height="35" /><span
            >Atlas <strong>Meet</strong></span
          ></a
        >
        <nav id="navigation" aria-label="주 메뉴">
          <button type="button" id="nav-home" aria-current="page">회의실</button
          ><button type="button" id="nav-history">회의 기록</button>
        </nav>
        <div class="header-date"><i data-i="calendar"></i><time id="today"></time></div>
      </div>
    </header>
    <main id="lobby" class="page">
      <div class="page-heading">
        <h1>회의 준비</h1>
        <p>장치를 확인하고 팀 회의를 시작하세요.</p>
      </div>
      <div class="prep-grid">
        <section class="preview-shell" aria-label="내 장치 미리보기">
          <div class="preview-stage">
            <canvas id="cover" aria-hidden="true"></canvas>
            <video id="preview-video" autoplay playsinline muted hidden></video>
            <div class="preview-top">
              <span class="preview-tag"><i data-i="view"></i> 내 화면 미리보기</span>
            </div>
            <div class="preview-bottom">
              <span id="preview-caption">카메라가 꺼져 있습니다</span
              ><span class="mic-meter" id="meter" aria-hidden="true"
                ><b></b><b></b><b></b><b></b><b></b><b></b><b></b
              ></span>
            </div>
          </div>
          <div class="devices">
            <span class="device-heading">내 장치</span>
            <div class="device-actions">
              <button id="preview-mic" class="device-btn" type="button" aria-pressed="false">
                <i data-i="mic-off"></i><span>마이크 꺼짐</span>
              </button>
              <button id="preview-camera" class="device-btn" type="button" aria-pressed="false">
                <i data-i="camera-off"></i><span>카메라 꺼짐</span>
              </button>
            </div>
          </div>
        </section>
        <section class="setup" aria-label="회의 입장 설정">
          <div class="mode-bar" aria-label="입장 방식" role="group">
            <button id="mode-create" type="button" aria-pressed="true">
              <i data-i="plus"></i>새 회의</button
            ><button id="mode-join" type="button" aria-pressed="false">
              <i data-i="link"></i>초대로 참여
            </button>
          </div>
          <form id="entry-form">
            <div id="title-field" class="field">
              <label for="room-title">회의 이름</label
              ><input
                id="room-title"
                maxlength="80"
                placeholder="예: 제품팀 주간 회의"
                autocomplete="off"
              />
            </div>
            <div id="room-key-field" class="field" hidden>
              <label for="room-key">팀 회의 개설 키</label>
              <input id="room-key" type="password" autocomplete="off" spellcheck="false"
                placeholder="관리자에게 받은 개설 키" />
            </div>
            <div id="invite-field" class="field" hidden>
              <label for="room-invite">초대 링크 또는 회의 코드</label
              ><input
                id="room-invite"
                placeholder="초대받은 링크를 붙여넣으세요"
                spellcheck="false"
                autocapitalize="none"
                autocomplete="off"
              /><small id="invite-detail" role="status" hidden></small>
            </div>
            <div class="field">
              <label for="display-name">내 이름</label
              ><input
                id="display-name"
                maxlength="32"
                placeholder="참석자에게 표시할 이름"
                autocomplete="nickname"
                required
              />
            </div>
            <label class="speech-setting"
              ><span class="feature-icon"><i data-i="audio"></i></span
              ><span class="speech-label"
                ><strong>내 발언 전사</strong
                ><small id="speech-help"
                  >전사 설정을 확인하는 중입니다.</small
                ></span
              ><input
                type="checkbox"
                role="switch"
                id="speech-opt"
                disabled
                autocomplete="off"
                aria-describedby="speech-help" /><span class="switch" aria-hidden="true"></span
            ></label>
            <p id="form-error" role="alert" hidden></p>
            <button class="primary full" id="enter" type="submit">
              <i data-i="video"></i><span>회의 만들기</span><i data-i="arrow"></i>
            </button>
          </form>
        </section>
      </div>
      <section class="recent-section">
        <div class="section-title">
          <h2>최근 회의</h2>
          <button id="all-history" class="text-button" type="button">
            전체 기록<i data-i="chevron"></i>
          </button>
        </div>
        <div id="recent-list"></div>
      </section>
    </main>
    <main id="history-page" class="page" hidden>
      <div class="page-heading">
        <h1>회의 기록</h1>
        <p>이 브라우저에서 참여한 회의와 발언 기록을 찾아보세요.</p>
      </div>
      <div class="history-filter">
        <i data-i="search"></i
        ><input
          id="history-query"
          type="search"
          placeholder="회의 이름 검색"
          aria-label="회의 이름 검색"
        />
      </div>
      <div id="history-list"></div>
    </main>
    <main id="archive" class="page archive" hidden>
      <button type="button" id="back-history" class="text-button"><i data-i="back"></i>회의 기록</button>
      <div class="archive-heading">
        <div class="page-heading">
          <h1 id="archive-title">회의 기록</h1>
          <p id="archive-desc" role="status"></p>
        </div>
        <div class="archive-actions">
          <button type="button" id="archive-join" class="secondary">
            <i data-i="video"></i>다시 입장</button
          ><button type="button" id="archive-export" class="primary">
            <i data-i="download"></i>전사 내려받기
          </button>
        </div>
      </div>
      <div id="archive-entries" class="archive-entries"></div>
    </main>
    <main id="room" class="page room-page" hidden>
      <div class="room-heading">
        <div>
          <div class="room-status">
            <span class="status-dot"></span><span id="connection">연결 중</span
            ><span class="clock" id="duration"></span>
          </div>
          <h1 id="meeting-name">팀 회의</h1>
        </div>
        <button id="copy-invite" class="secondary" type="button">
          <i data-i="link"></i>초대 링크 복사
        </button>
      </div>
      <div class="room-layout">
        <section class="call-area" aria-label="화상 회의">
          <div class="video-grid" id="tiles"></div>
          <button id="enable-sound" class="secondary" type="button" hidden>
            <i data-i="volume"></i>참석자 소리 재생
          </button>
          <div class="call-toolbar" aria-label="회의 제어">
            <div class="call-devices">
              <button type="button" id="call-mic" class="tool" aria-pressed="false">
                <i data-i="mic-off"></i><span>마이크</span>
              </button>
              <button type="button" id="call-camera" class="tool" aria-pressed="false">
                <i data-i="camera-off"></i><span>카메라</span>
              </button>
              <button type="button" id="call-speech" class="tool" aria-pressed="false">
                <i data-i="audio"></i><span>내 발언 전사</span>
              </button>
            </div>
            <button type="button" id="leave" class="leave">
              <i data-i="hangup"></i><span>나가기</span>
            </button>
          </div>
        </section>
        <aside class="sidepanel">
          <div class="panel-tabs" role="group" aria-label="회의 패널">
            <button type="button" id="panel-transcript" aria-pressed="true">
              <i data-i="text"></i>실시간 전사</button
            ><button type="button" id="panel-people" aria-pressed="false">
              <i data-i="people"></i>참석자 <span id="people-count">0</span>
            </button>
          </div>
          <div id="live-entries" class="live-entries" role="log" aria-label="실시간 발언"></div>
          <div id="people-list" hidden></div>
          <div class="panel-footer">
            <small><span id="call-engine"></span>초대 링크로 전사 기록을 열 수 있습니다.</small
            ><button
              type="button"
              id="live-export"
              class="icon-button"
              aria-label="전사 내려받기"
              title="전사 내려받기"
              disabled
            >
              <i data-i="download"></i>
            </button>
          </div>
        </aside>
      </div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="invite-dialog">
      <form method="dialog">
        <h2>회의 초대 링크</h2>
        <label for="invite-copy">이 링크로 회의에 참여하고 전사 기록을 볼 수 있습니다.</label
        ><input id="invite-copy" readonly /><button class="primary" value="close">닫기</button>
      </form>
    </dialog>
  </body>
</html>
